name: CI

on:
  push:
  pull_request:
  schedule:
    # Run once a month
    - cron: '1 2 3 * *'

# The prod image bakes in the proprietary SmartSpectra SDK, whose apt repo is
# IP-allowlisted to known networks — GitHub's shared runners can't reach it
# (403), and a proprietary SDK shouldn't be published from public CI anyway.
# So CI only validates the SDK-free packages; the image is built and pushed
# from an allowlisted machine with ./build.sh -p.
jobs:
  validate:
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Build smartspectra_msgs (no SDK required)
        shell: bash
        run: |
          set -e
          apt-get update
          apt-get install -y python3-colcon-common-extensions
          rosdep update
          rosdep install --from-paths src/smartspectra_msgs --ignore-src -y
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select smartspectra_msgs
